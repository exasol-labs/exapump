name: CI

# NOTE: paths-ignore below only stays safe as long as this workflow's
# checks are never made a required status check in the main ruleset (they
# aren't today -- only 1 approving review is required). If that changes,
# skipped-vs-missing checks can block merges on spec/docs-only PRs; switch
# to an always-on trigger with a path-filter step gating the expensive jobs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "specs/**"
      - "docs/**"
      - "README.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "specs/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check and unit tests
        run: ./scripts/check.sh

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Start Exasol container
        run: |
          docker run -d \
            --name exasol-test \
            --privileged \
            --shm-size=2g \
            -e COSLWD_ENABLED=1 \
            -p 8563:8563 \
            -p 2581:2581 \
            exasol/docker-db:2025.2.0

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Wait for Exasol to be ready
        timeout-minutes: 30
        run: |
          cargo run --bin exapump -- wait \
            --container exasol-test \
            --timeout-secs 1500 \
            --dsn 'exasol://sys:exasol@localhost:8563?tls=true&validateservercertificate=0'

      - name: Integration tests
        env:
          REQUIRE_EXASOL: "1"
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Exasol container logs
        if: always()
        run: docker logs --tail 100 exasol-test 2>&1 || true

      - name: Stop Exasol container
        if: always()
        run: |
          docker stop exasol-test || true
          docker rm exasol-test || true

  sonar:
    name: Sonar Analysis
    needs: [integration-tests]
    runs-on: ubuntu-latest
    # Fork PRs don't get repo secrets, so SONAR_TOKEN would be empty and fail the scan.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones disabled for a better relevancy of analysis

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: lcov

      - name: Read crate version
        id: crate-version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not extract a version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectVersion=${{ steps.crate-version.outputs.version }}
