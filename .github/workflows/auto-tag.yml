name: Release

# NOTE: workflow_dispatch is the manual escape hatch for when the push event
# is lost -- e.g. a GitHub Actions outage swallowing the merge to main. It is
# safe to run at any time: detect-version gates every downstream job on the
# Cargo.toml version having no matching tag yet, so a dispatch on an already
# released commit is a no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for version bump
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — no version bump."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected: $tag"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

  build-binaries-linux:
    name: Binary (${{ matrix.name }})
    needs: [detect-version]
    if: needs.detect-version.outputs.bumped == 'true'
    runs-on: ${{ matrix.os }}
    container: almalinux:8
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: exapump-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: exapump-linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          dnf install -y gcc binutils curl ca-certificates
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Enforce glibc ceiling
        run: |
          max_allowed=GLIBC_2.28
          ceiling=$(objdump -T target/${{ matrix.target }}/release/exapump | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Detected glibc ceiling: $ceiling"
          max=$(printf '%s\n%s\n' "$ceiling" "$max_allowed" | sort -V | tail -1)
          if [ "$max" != "$max_allowed" ]; then
            echo "glibc ceiling $ceiling exceeds the allowed maximum of $max_allowed"
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/exapump

  build-binaries-native:
    name: Binary (${{ matrix.name }})
    needs: [detect-version]
    if: needs.detect-version.outputs.bumped == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: exapump-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: exapump-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: exapump-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/exapump

      - name: Upload binary (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/exapump.exe

  release:
    name: Release
    needs: [detect-version, build-binaries-linux, build-binaries-native]
    if: needs.detect-version.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          tag="${{ needs.detect-version.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          version="${{ needs.detect-version.outputs.tag }}"
          version="${version#v}"
          mkdir release-assets
          for dir in artifacts/exapump-*/; do
            name="$(basename "$dir")"
            versioned="${name/exapump-/exapump-${version}-}"
            if [ "$name" = "exapump-windows-x86_64" ]; then
              cp "$dir/exapump.exe" "release-assets/${versioned}.exe"
            else
              cp "$dir/exapump" "release-assets/${versioned}"
              chmod +x "release-assets/${versioned}"
            fi
          done

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate third-party licenses
        run: ./scripts/generate-licenses.sh > release-assets/third-party-licenses.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
