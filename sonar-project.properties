# SonarQube Cloud project binding
sonar.projectKey=exasol-labs_exapump
sonar.organization=exasol-labs

# Source layout
sonar.sources=src
sonar.tests=tests

# Rust test coverage for the full test suite, including integration tests
# (imported from the integration-tests job artifact).
sonar.rust.lcov.reportPaths=lcov.info

# Fail the scan step (and thus the GitHub check) when the Quality Gate fails
sonar.qualitygate.wait=true
